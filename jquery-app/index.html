<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>My Mobile Site</title>

  <!-- jQuery & jQuery Mobile CSS/JS -->
  <link rel="stylesheet" href="https://code.jquery.com/mobile/1.5.0-alpha.1/jquery.mobile-1.5.0-alpha.1.min.css" />
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://code.jquery.com/mobile/1.5.0-alpha.1/jquery.mobile-1.5.0-alpha.1.min.js"></script>

  <style>
    /* Custom Styles to override jQuery Mobile Defaults */
    body {
      background-color: #0000; /* Light blue background */
      color: #333; /* Default text color */
    }


    .ui-page {
      background-color: #f0f8ff; /* Light blue background for all pages */
    }

    .ui-header {
      background-color: #607d8b !important; /* Dark grey-blue header */
      color: white;
    }

    .ui-content {
      background-color: #e3f2fd !important; /* Light blue content section */
      padding: 20px;
      text-align: center;
    }

    .ui-footer {
      background-color: #607d8b !important; /* Dark grey-blue footer */
      color: white;
      text-align: center;
    }

    h1, h2 {
      color: #424242; /* Dark grey for text */
    }

    .ui-btn {
      background-color: #1976d2 !important; /* Blue buttons */
      color: white !important;
      border-radius: 5px;
      margin: 10px 0;
    }

    .ui-btn:hover {
      background-color: #1565c0 !important; /* Darker blue on hover */
    }

    input, textarea {
      background-color: #fff;
      border: 1px solid #ccc;
      border-radius: 5px;
      padding: 10px;
      width: 100%;
      box-sizing: border-box;
    }

    input[type="submit"] {
      background-color: #4caf50 !important; /* Green submit button */
      color: white;
      border: none;
    }

    input[type="submit"]:hover {
      background-color: #45a049 !important; /* Darker green on hover */
    }
  </style>

</head>
<body>

  <!-- Home Page -->
  <div data-role="page" id="home">
    <div data-role="header">
      <h1>Welcome</h1>
    </div>
    
    <div data-role="content">
      <h2>Hello!</h2>
      <p>This is a simple mobile website using jQuery Mobile.</p>
      <a href="#about" data-role="button" data-transition="slide">About Us</a>
      <a href="#contact" data-role="button" data-transition="slide">Contact</a>
    </div>

    <div data-role="footer" data-position="fixed">
      <h4>My Mobile Site © 2025</h4>
    </div>
  </div>

  <!-- About Page -->
  <div data-role="page" id="about">
    <div data-role="header">
      <h1>About Us</h1>
      <a href="#home" data-icon="back" data-rel="back">Back</a>
    </div>
    
    <div data-role="content">
      <p>We are a team passionate about building mobile-friendly web apps.</p>
    </div>

    <div data-role="footer" data-position="fixed">
      <h4>My Mobile Site © 2025</h4>
    </div>
  </div>

  <!-- Contact Page -->
  <div data-role="page" id="contact">
    <div data-role="header">
      <h1>Contact Us</h1>
      <a href="#home" data-icon="back" data-rel="back">Back</a>
    </div>
    
    <div data-role="content">
      <form>
        <label for="name">Name:</label>
        <input type="text" name="name" id="name" />
        
        <label for="email">Email:</label>
        <input type="email" name="email" id="email" />
        
        <label for="message">Message:</label>
        <textarea name="message" id="message"></textarea>
        
        <input type="submit" value="Send" />
      </form>
    </div>

    <div data-role="footer" data-position="fixed">
      <h4>My Mobile Site © 2025</h4>
    </div>
  </div>

</body>
</html>
